# Render Blueprint for the LedgerSpy PUBLIC DEMO (synthetic data only). Free plan only: no paid resources.
# No secret is stored here. Values marked `sync: false` are entered by hand in the Render dashboard; the
# session key is generated by Render. See docs/demo/deployment-checklist.md before creating the service.
services:
  - type: web
    name: ledgerspy-demo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/demo/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: LEDGERSPY_DEMO_SESSION_KEY  # signs workspace cookies and derives workspace tokens
        generateValue: true
      - key: LEDGERSPY_DEMO_PUBLIC_ORIGIN  # required: https://<service>.onrender.com (no trailing slash)
        sync: false
      - key: LEDGERSPY_DEMO_TRUSTED_PROXY_HOPS  # 0 = forwarded headers ignored (see the checklist)
        value: "0"
      # Optional persistence (all three, or none; none = work is lost on every restart, and the UI says so):
      - key: LEDGERSPY_DEMO_STORAGE_URL  # https://<project-ref>.supabase.co
        sync: false
      - key: LEDGERSPY_DEMO_STORAGE_BUCKET  # a PRIVATE bucket
        sync: false
      - key: LEDGERSPY_DEMO_STORAGE_SERVICE_KEY  # secret; server-side only
        sync: false
