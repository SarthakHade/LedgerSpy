# LedgerSpy configuration — the single source of configurable values.
#
# Every key is required and validated (ledgerspy/config/schema.py); unknown keys are rejected.
# The SHA-256 of the effective configuration (this file + any case overrides) is computed by
# ledgerspy.config.load_config() and recorded wherever results must be reproducible.
#
# Later phases add their own sections here (quality in P4, rules and benford in P7,
# risk tiers and review budget in P9, ...). Do not hard-code such values in code.

config_version: 1

server:
  # Loopback only. The schema rejects any other address.
  host: 127.0.0.1
  port: 8765

workspace:
  # Relative paths resolve against the current working directory. The workspace holds client data
  # and is git-ignored.
  path: workspace
  db_filename: ledgerspy.db

# ---------------------------------------------------------------------------------------------
# P3 — ingestion limits. A file breaking any limit is rejected with an explicit error.
ingest:
  max_file_bytes: 104857600        # 100 MiB, enforced while the upload streams in
  max_rows: 1000000                # data records after the header
  max_columns: 512
  max_cell_chars: 32767            # Excel's own per-cell limit
  csv:
    encodings: [utf-8, cp1252]     # tried in order when there is no BOM; anything else is rejected
    delimiters: [",", ";", "\t", "|"]
    sniff_bytes: 65536             # text sample used to detect the delimiter
  xlsx:
    max_uncompressed_bytes: 524288000   # 500 MiB summed over all zip entries
    max_compression_ratio: 100          # per entry; same default as Apache POI (min inflate ratio 0.01)
    ratio_check_min_bytes: 1048576      # tiny entries legitimately compress well; check entries above 1 MiB
    max_zip_entries: 10000
  minor_units:
    # Amounts are stored as integers in minor units. A value with more decimals than this is never
    # rounded: it is recorded as an ingestion issue instead.
    default_digits: 2
    by_currency: {JPY: 0, KRW: 0, BHD: 3, JOD: 3, KWD: 3, OMR: 3, TND: 3}

# ---------------------------------------------------------------------------------------------
# P3 — column mapping. Headers are compared after case-folding and keeping only letters/digits,
# so "Posting_Date", "posting date" and "POSTING-DATE" are the same key. Only exact alias matches are
# ever suggested; anything else needs the user to confirm the mapping.
mapping:
  min_parse_rate: 0.98             # share of distinct values that must parse before a suggestion is made
  # A *confirmed* mapping is refused when more than this share of rows cannot be converted in some field
  # (a wrong column, date format or decimal separator). Smaller gaps are kept as ingestion issues for P4.
  max_unconvertible_share: 0.5
  profile_distinct_cap: 1000       # distinct values kept per column for profiling
  sample_values: 3                 # example values shown per column
  # Ground-truth columns. Never mappable, never in canonical transactions; stored in `labels` only.
  # Kept in sync with frontend/js/shared.js LS_CONFIG.labelColumns (checked by a test).
  label_columns: [isFraud, fraud, isFlaggedFraud, flaggedFraud, flagged, label, target, groundTruth]
  aliases:
    txn_id: [txn id, transaction id, tx id, trans id, entry id, line id, journal line id, id]
    posted_at: [date, posting date, posted at, posted on, transaction date, txn date, tx date, trans date,
                date of transaction, entry date, voucher date, book date, value date]
    document_date: [document date, doc date, invoice date, bill date]
    amount: [amount, amt, amount inr, transaction amount, txn amount, net amount]
    debit_amount: [debit, dr, debit amount, dr amount, withdrawal, withdrawals, withdrawal amount]
    credit_amount: [credit, cr, credit amount, cr amount, deposit, deposits, deposit amount]
    direction: [direction, dr cr, debit credit, drcr indicator, debit credit indicator]
    currency: [currency, ccy, curr, currency code]
    account: [account, account code, account no, account number, gl account, gl code, ledger account,
              ledger code]
    payer_raw: [payer, sender, from, remitter, originator, name orig, source]
    payee_raw: [payee, vendor, vendor name, supplier, supplier name, beneficiary, receiver, to, party,
                party name, name dest, destination]
    reference: [reference, ref, ref no, reference no, reference number, invoice no, invoice number,
                bill no, cheque no, check no, utr, voucher no, voucher number, document no, doc no]
    description: [description, narration, memo, particulars, details, remarks]
    txn_type: [type, txn type, transaction type, entry type, voucher type]
  direction_values:
    debit: [debit, dr, d]
    credit: [credit, cr, c]
    out: [out, outflow]
    in: [in, inflow]
  # strptime formats tried on text dates. When more than one fits and they disagree (e.g. 06/01/2024),
  # the user must choose.
  date_formats: ["%Y-%m-%d", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S", "%Y-%m-%d %H:%M", "%Y/%m/%d",
                 "%d/%m/%Y", "%m/%d/%Y", "%d-%m-%Y", "%m-%d-%Y", "%d.%m.%Y", "%d/%m/%Y %H:%M",
                 "%m/%d/%Y %H:%M", "%d/%m/%Y %H:%M:%S", "%m/%d/%Y %H:%M:%S", "%d-%b-%Y", "%d %b %Y",
                 "%d-%b-%y", "%b %d, %Y"]

# ---------------------------------------------------------------------------------------------
# P3 — source adapters.
adapters:
  paysim:
    # PaySim is a SIMULATION. Its only time field is `step` (1 step = 1 simulated hour, starting at 1).
    # posted_at = step_epoch + (step - 1) * step_hours. The epoch is deliberately artificial so a PaySim
    # timestamp can never be mistaken for a real accounting date; datasets record time_basis
    # "simulation_step".
    step_epoch: "1970-01-01T00:00:00"
    step_hours: 1
    # Direction relative to the nameOrig account, verified on data/raw/paysim_sample_10k.csv:
    # CASH_IN raises the origin balance by `amount`; every other type lowers it or leaves it unchanged.
    direction_by_type: {CASH_IN: in, CASH_OUT: out, DEBIT: out, PAYMENT: out, TRANSFER: out}
    # Running-balance columns of the origin account (kept in `extra`). They are simulator output, checked by the
    # P4 balance_continuity check only as a data-integrity signal: expected after = before -/+ amount.
    balance_columns: {before: oldbalanceOrg, after: newbalanceOrig}

# ---------------------------------------------------------------------------------------------
# P4 — data quality. Checks run on the normalised view of a canonical dataset (P3 rows + applied
# transformations). Every issue has a severity assigned by the rules below, nothing else.
quality:
  # Fields every transaction must have. A blank one is a `missing_required` issue.
  required_fields: [posted_at, amount_minor, direction]
  # Fields reported with completeness percentages when they are mapped (`missing_optional`).
  optional_fields: [document_date, currency, account, payer_raw, payee_raw, reference, description, txn_type]
  # A corporate ledger normally has these. When a generic ledger has no column for one, `field_coverage` records
  # it as a limitation (INFO). Adapters can declare a field not applicable (PaySim: no references, narration...).
  expected_ledger_fields: [document_date, currency, account, payee_raw, reference, description]
  # `implausible_date`: posting dates outside this range (not applied to simulated clocks).
  date_bounds: {earliest: "1900-01-01", latest: "2100-12-31"}
  # `near_duplicate`: same payee, amount and direction within this many days (not an exact duplicate).
  near_duplicate_window_days: 3
  # `malformed_identifier`: control/format characters (e.g. zero-width) or longer than identifier_max_length.
  identifier_fields: [account, reference]
  identifier_max_length: 64
  balance:
    # Generic ledgers: an unmapped column with one of these headers is a running balance. Its sign convention
    # (does a debit raise or lower it?) is inferred from the data and must explain at least this share of the
    # debit/credit transitions, otherwise the check reports `not_available` instead of guessing.
    running_balance_aliases: [balance, running balance, closing balance, balance amount]
    min_convention_share: 0.5
  severity:
    # Severity of an issue = the check's base severity, raised by the highest escalation rule that matches
    # (the share of ALL rows affected by that check reaches min_share); escalation never lowers it.
    # For synthetic datasets (e.g. PaySim) a synthetic_overrides entry replaces all of this and is final:
    # those checks measure simulator behaviour, so their prevalence says nothing about ledger quality.
    # Levels: info < warning < error < critical.
    base:
      missing_required: error          # analysis cannot use the row as is
      missing_optional: info
      invalid_value: error             # value present in the source but not convertible
      unparseable_date: error
      implausible_date: error
      malformed_identifier: warning
      exact_duplicate: warning         # may be a double posting; never removed automatically
      near_duplicate: info
      negative_amount: info            # reversals/credits are legitimate
      zero_amount: warning
      out_of_period: warning
      balance_continuity: warning
      duplicate_source_id: warning
      unmapped_columns: info
      field_coverage: info
      needs_normalization: info
      ingestion_issues: info
    synthetic_overrides:
      balance_continuity: info         # PaySim balances are known simulator artefacts, not ledger errors
    escalation:
      - {check: missing_required, min_share: 0.05, severity: critical}
      - {check: invalid_value, min_share: 0.05, severity: critical}
      - {check: unparseable_date, min_share: 0.05, severity: critical}
      - {check: implausible_date, min_share: 0.05, severity: critical}
      - {check: missing_optional, min_share: 0.20, severity: warning}
      - {check: exact_duplicate, min_share: 0.01, severity: error}
      - {check: near_duplicate, min_share: 0.05, severity: warning}
      - {check: zero_amount, min_share: 0.05, severity: error}
      - {check: out_of_period, min_share: 0.05, severity: error}
      - {check: balance_continuity, min_share: 0.05, severity: error}
  readiness:
    # readiness = floor_1dp(100 x sum(w_c x clean_c) / sum(w_c)) over ASSESSED components, where
    # clean_c = 1 - (rows with at least one issue of severity >= min_severity from the component's checks) / rows.
    # A component is assessed when at least one of its checks could run (not `not_available`).
    # If any issue has severity >= blocking_severity, the score is capped at max_score_when_blocking and the
    # status is `not_ready`; it can therefore never read 100 while blocking issues remain.
    min_severity: warning
    blocking_severity: error
    max_score_when_blocking: 99.9
    components:
      completeness: {weight: 0.35, checks: [missing_required]}
      validity: {weight: 0.30, checks: [invalid_value, unparseable_date, implausible_date, malformed_identifier]}
      uniqueness: {weight: 0.20, checks: [exact_duplicate, duplicate_source_id]}
      consistency: {weight: 0.15, checks: [balance_continuity, out_of_period, zero_amount, negative_amount,
                                           near_duplicate]}

# ---------------------------------------------------------------------------------------------
# P4 — normalisation. Only PROPOSED here; nothing changes until an analyst accepts a fix and applies it.
normalize:
  # collapse runs of whitespace (incl. non-breaking spaces) to one space
  whitespace_fields: [payer_raw, payee_raw, description, txn_type]
  # identifiers: Unicode NFKC, drop control/zero-width characters, collapse whitespace
  identifier_fields: [account, reference]
  # explicit case normalisation, per field
  case: {txn_type: upper}

# ---------------------------------------------------------------------------------------------
# P5 — synthetic company generator (`ledgerspy synth`). CLI flags override these defaults.
# The approval limits are the fictional company's POLICY: scenarios are built relative to them, and later
# detectors must read thresholds from configuration/company data, never from code.
synth:
  seed: 42
  start_date: "2023-04-01"          # first day of the first financial year (April–March)
  years: 3
  scale: 1.0                        # multiplies the number of normal vendors, employees and customers
  currency: INR
  approval_limits:
    expense_claim_minor: 500000     # ₹5,000.00: expense claims at or above need Finance approval
    vendor_payment_minor: 20000000  # ₹2,00,000.00: vendor payments at or above need CFO approval
  business_hours: ["09:30", "18:30"]  # Monday–Saturday, except company holidays

# ---------------------------------------------------------------------------------------------
# P6 — feature registry. Every feature is defined once in ledgerspy/features (name, version, meaning, inputs,
# point-in-time rule). These values parameterise those definitions; the effective values are hashed into every
# feature manifest. Features read canonical fields (normalised view) only — never `extra`, labels or ground truth.
features:
  # Point-in-time history = rows with a strictly earlier posting timestamp (rows sharing a timestamp never see
  # each other). Baselines use at most the most recent `baseline_window` prior observations of a group.
  baseline_window: 200
  min_entity_history: 5   # an entity (counterparty) baseline needs at least this many prior rows
  min_peer_history: 20    # a peer-group or global baseline needs at least this many prior rows
  min_peers: 3            # peer-relative frequency needs this many other active counterparties in the group
  mad_scale_floor: 0.1    # smallest robust scale (log-amount units, ~10%): a constant history never divides by 0
  round_level_min: 3      # "round" = a multiple of 10^3 currency units (₹1,000) for round-share features
  velocity_min_history_days: 90  # velocity deviation needs this much history before the recent 30 days
  trend_window_days: 180  # escalation trend: slope over the prior rows in this window ...
  trend_min_points: 6     # ... when there are at least this many
  recent_days: 90         # entity (post-period) features: "recent" = the last 90 days of the dataset
  calendar:
    business_hours: ["09:30", "18:30"]  # after-hours = posted outside this window (case-specific)
    non_working_weekdays: [6]           # Monday=0 … Sunday=6 (Monday–Saturday working week)
    fiscal_year_start_month: 4          # April–March financial year
    holidays: []                        # case-specific list of YYYY-MM-DD; empty → is_holiday is not available
  # Approval limits (delegation of authority) in minor units, case-specific. Empty → threshold_proximity is not
  # available. A case supplies them as a config override, e.g. [{name: expense_claim, amount_minor: 500000}].
  approval_thresholds: []
  # How each adapter's canonical fields are read.
  #   counterparty: by_direction = payee for debit/out rows and payer for credit/in rows (a company ledger or bank
  #                 statement); payee = always the payee (PaySim: the origin account books every row).
  #   account_is_category: the `account` field is a GL/category code usable as a peer group (not an account holder).
  #   corporate: approval thresholds apply.
  adapters:
    generic_ledger: {counterparty: by_direction, account_is_category: true, corporate: true}
    paysim: {counterparty: payee, account_is_category: false, corporate: false}
  # Feature-quality report flags (reported, never used to drop features).
  report:
    max_missing_share: 0.5      # "excessive missingness" above this share of rows
    min_distinct_values: 2      # fewer distinct non-null values → "constant"

# ---------------------------------------------------------------------------------------------
# P7 — forensic rules. Each rule reads P6 registry features (never raw files, labels or ground truth) and emits
# explainable signals. `severity` and `weight` are placeholders that P9 (risk fusion) will calibrate; strength is
# binary (1.0 when a rule fires). A rule whose inputs are missing reports not_available with the reason.
rules:
  duplicate_exact:      # same payer, payee, amount, direction, posting date and reference (if mapped)
    enabled: true
    severity: high
    weight: 0.6
  duplicate_near:       # same payee and direction within window_days; amount and reference nearly equal
    enabled: true
    severity: medium
    weight: 0.5
    window_days: 14
    amount_relative_tolerance: 0.0      # 0 = the amount must be equal or have two adjacent digits transposed
  round_amount:         # a counterparty whose amounts are round far more often than the population's
    enabled: true
    severity: medium
    weight: 0.3
    min_rows: 6                       # population gate per counterparty stream
    min_round_share: 0.5
    min_distinct_round_amounts: 4     # one fixed contractual amount repeated is not fabrication
    max_p_value: 0.001                # one-sided binomial test vs the flow's round rate
  structuring:          # ≥ min_parts payments to one counterparty just below the same approval threshold
    enabled: true
    severity: high
    weight: 0.6
    window_days: 7
    min_parts: 2
    min_proximity: 0.95               # "just below": each part within 5% under the threshold; together above it
  temporal:             # off-hours posting that is not an established routine for the counterparty
    enabled: true
    severity: medium
    weight: 0.4
    routine_after_months: 2           # off-hours in ≥ this many earlier months = routine, not flagged
  new_vendor_large:     # little or no history with the counterparty and an amount far above its peers
    enabled: true
    severity: high
    weight: 0.5
    max_prior_count: 3
    min_robust_z: 3.0                 # 3 robust standard deviations above the peer baseline
    min_days_observed: 90             # in the first 90 days of data every long-standing vendor looks "new"
    peer_bases: [account, txn_type]   # the robust z must come from a peer group, not the global baseline
  balance_continuity:   # P4 found a running balance that does not follow from the previous balance ± amount
    enabled: true
    severity: medium
    weight: 0.4
    ignore_kinds: [balance_unchanged, balance_zeroed]  # documented PaySim simulator artefacts (P4 counts them)
  dormancy:             # first posting after a long silence, at an unusual amount for the counterparty
    enabled: true
    severity: medium
    weight: 0.4
    min_dormant_days: 180
    min_amount_ratio: 2.0
  period_end:           # a cluster of unusually large postings to one counterparty at a period end
    enabled: true
    severity: medium
    weight: 0.4
    period: fiscal_year               # fiscal_year | month
    window_days: 3                    # the last 3 days of the period
    min_stream_rows: 10               # counterparty history needed to know its normal rate
    min_cluster: 3
    min_concentration: 5.0            # rows in the window ≥ 5 × the stream's normal rate for such a window
    min_amount_ratio: 1.5             # median amount in the window ≥ 1.5 × the stream's median
  velocity:             # far more postings in 30 days than the counterparty's historical pace
    enabled: true
    severity: medium
    weight: 0.4
    min_velocity_ratio: 4.0
    min_count_30d: 4
    max_p_value: 0.0001               # Poisson tail at the counterparty's own past rate; ~10⁴ rows are tested, so
                                      # n × p < 1 keeps chance alarms rare (multiple-testing correction)

# P7 — Benford analysis (architecture §7). A deviation is an investigative signal, never proof of fraud.
benford:
  min_value_major: 10           # first-digit tests use |amount| ≥ 10 currency units
  last_two_min_major: 100       # last-two-digit test uses whole amounts ≥ 100 units (so the digits are not leading)
  negative_amounts: exclude     # exclude | absolute
  min_n: {first: 300, first_two: 1000, last_two: 1000}
  warn_n: {first: 1000, first_two: 3000, last_two: 3000}
  min_distinct_values: 10       # fewer distinct amounts: invalid_population (a degenerate population)
  warn_range_ratio: 100         # max/min below this: analysed, with a warning (narrow ranges rarely follow Benford)
  z_critical: 1.96
  # Nigrini's MAD conformity bands: close / acceptable / marginal upper bounds; above = nonconformity.
  mad_bands:
    first: [0.006, 0.012, 0.015]
    first_two: [0.0012, 0.0018, 0.0022]
  subgroups:
    dimensions: [counterparty, account, txn_type, fiscal_year]
    tests: [first]
    min_n: 300
    signal_bands: [nonconformity]
    max_example_rows: 20
  severity: low
  weight: 0.2

# ---------------------------------------------------------------------------------------------
# P8 — statistical anomaly detection (architecture §5.3, docs/anomaly-model-card.md). Three label-free detectors
# score P6 registry features (never labels, ground truth, `extra` or P7 signals): an Isolation Forest, robust
# peer-group z-scores and tail percentiles. "Anomalous" means unusual relative to the stated population, never
# "fraudulent". Signals feed P9 risk fusion; P8 does not fuse.
anomaly:
  # Which rows form the reference population (fit, medians, cutoffs) and which rows are scored.
  #   dataset:       transductive — every row is both (the audit question: what is unusual in this period?)
  #   chronological: the earliest `chronological_fraction` of rows (by posting time) is the reference and only the
  #                  later rows are scored, so no baseline ever contains a row's future.
  reference:
    mode: dataset
    chronological_fraction: 0.5
    # With real calendar dates, rows in the first 90 days are not scored and not part of the reference: their
    # point-in-time history is not yet representative (every long-standing vendor looks new). Same reasoning
    # as rules.new_vendor_large.min_days_observed.
    warmup_days: 90
  # A feature is used only if it is a computed, numeric, row/point-in-time P6 feature (dataset/post-period
  # features would leak the future in chronological mode) with at most `max_missing_share` nulls and at least
  # `min_distinct_values` distinct values in the reference population.
  eligibility:
    max_missing_share: 0.5
    min_distinct_values: 2
    min_row_present_share: 0.5    # a row needs at least half of the model's features present to be scored
  isolation_forest:
    enabled: true
    severity: medium
    weight: 0.4
    random_state: 42
    n_estimators: 100             # Liu et al. (2008): path lengths converge well before 100 trees
    max_samples: 256              # sub-sample per tree (the paper's ψ = 256)
    min_rows: 256                 # fewer scorable rows: insufficient_data (no meaningless model)
    min_features: 3
    # Threshold policy (instead of sklearn's contamination): a row is flagged when its score is in the top
    # `tail_fraction` of the reference scores, above `min_score` (0.5 = the paper's "no distinct anomaly" level),
    # and among the `max_flagged` highest scores (review capacity).
    tail_fraction: 0.01
    max_flagged: 100
    min_score: 0.5
    max_explained_features: 3     # feature deviations shown per flagged row (robust z, not SHAP)
    # Behaviour of a transaction relative to its counterparty, peers and time — no identifiers, no labels, no
    # policy thresholds, no data-quality flags (see the model card for why each is eligible).
    features:
      - {name: log_amount, transform: none}
      - {name: amount_robust_z, transform: none}
      - {name: amount_pctl_prior, transform: none}
      - {name: amount_to_cp_median_ratio, transform: signed_log1p}
      - {name: amount_to_account_median_ratio, transform: signed_log1p}
      - {name: cp_prev_amount_ratio, transform: signed_log1p}
      - {name: cp_prior_count, transform: signed_log1p}
      - {name: cp_days_since_prev, transform: signed_log1p}
      - {name: cp_days_since_first, transform: signed_log1p}
      - {name: cp_count_7d, transform: signed_log1p}
      - {name: cp_count_30d, transform: signed_log1p}
      - {name: cp_velocity_ratio, transform: signed_log1p}
      - {name: cp_count_30d_peer_ratio, transform: signed_log1p}
      - {name: cp_log_amount_trend, transform: none}
      - {name: hour_deviation, transform: none}
      - {name: payer_new_payees_7d, transform: signed_log1p}
      - {name: pair_share_of_payer_outflow, transform: none}
  # Robust z = (x − median) / scale within a peer group of the reference population, scale = 1.4826·MAD (or
  # 1.2533·mean absolute deviation when MAD = 0, Iglewicz–Hoaglin), never below the feature's `min_scale`
  # (resolution: 0.1 log units ≈ 10%, as features.mad_scale_floor; half an hour for posting times), so a very
  # regular stream (payroll every 28–31 days) is not "unusual" by a day. `peers` is ordered most specific
  # first: a row is judged against its own counterparty's history when that has `min_group_size` reference
  # values, else against its GL account / transaction type (the basis is reported). No global fallback: a row
  # without a sufficient peer group is insufficient_data.
  robust_peer:
    enabled: true
    severity: medium
    weight: 0.4
    min_group_size: 20
    z_threshold: 3.5              # Iglewicz & Hoaglin's recommended outlier cut-off for modified z-scores
    features:
      # amount vs the vendor's own amounts, else its GL category / transaction type
      - name: log_amount
        transform: none
        direction: both
        peers: [counterparty, account, txn_type]
        min_scale: 0.1
      # time gap vs the vendor's usual cadence: long = dormancy, short = burst
      - {name: cp_days_since_prev, transform: signed_log1p, direction: both, peers: [counterparty], min_scale: 0.1}
      # 30-day activity vs the vendor's usual 30-day activity (velocity)
      - {name: cp_count_30d, transform: signed_log1p, direction: higher, peers: [counterparty], min_scale: 0.1}
      # posting time (hours) vs the vendor's usual posting time
      - {name: hour_of_day, transform: none, direction: both, peers: [counterparty], min_scale: 0.5}
  # Tail percentiles within each flow (money out / money in) of the reference population. Percentile = mid-rank
  # ((values below + ½·values equal) / n), so a block of tied values never inflates a tail.
  tail:
    enabled: true
    severity: low
    weight: 0.2
    fractions: [0.01, 0.005]      # top 1% and top 0.5%
    min_population: 200           # smallest population in which the 0.5% tail holds a row
    features:
      - {name: amount_minor, direction: higher}
      - {name: amount_to_cp_median_ratio, direction: higher}
      - {name: amount_to_account_median_ratio, direction: higher}
      - {name: cp_velocity_ratio, direction: higher}
      - {name: cp_days_since_prev, direction: higher}
      - {name: hour_deviation, direction: higher}
  # Diagnostic evaluation only (never in the detection path): top-k sizes = review capacity in rows.
  evaluation:
    review_capacity: [50, 100, 250]

# ---------------------------------------------------------------------------------------------
# P9 — risk engine v1 (architecture §5.4, docs/risk-engine.md). Fuses P7 rule signals and P8 anomaly signals into
# a bounded 0–100 REVIEW-RISK SCORE: a forensic review priority, NOT a probability of fraud (nothing is calibrated
# against outcomes; supervised calibration is P10/P11). Labels and ground truth never enter.
#
#   signal evidence      e = strength × weight (from the detector's own configuration, rules.* / anomaly.*)
#   family evidence      F = min(cap, 1 − Π_k (1 − e_(k) · decay^k))    signals sorted strongest first
#   group evidence       G = min(group cap, 1 − Π_f (1 − F_f))          independent evidence source
#   risk score           100 × (1 − Π_g (1 − G_g))
#   contributions        exact split of the score in log-survival space: group g gets score × L_g / Σ L,
#                        L = −ln(1 − G); a group's share is split over its families and signals the same way.
risk:
  # Every detector belongs to exactly one family; an unknown detector is a configuration error. Caps keep one
  # family (and its correlated signals) from dominating: no family alone can push the score above 100 × cap.
  # A cap is at least the family's strongest single weight, so it only bites when signals accumulate.
  families:
    duplicate:            # exact / typo-style duplicate payments
      detectors: [duplicate_exact, duplicate_near]
      group: duplicate
      cap: 0.6
      scored: true
      label: Duplicate payments
    transaction_pattern:  # policy and behaviour rules on the transaction
      detectors: [structuring, new_vendor_large, dormancy, velocity]
      group: transaction_pattern
      cap: 0.6
      scored: true
      label: Transaction-pattern rules
    temporal:             # posting time and period-end timing
      detectors: [temporal, period_end]
      group: temporal
      cap: 0.4
      scored: true
      label: Timing rules
    entity_evidence:      # findings about the counterparty as a whole, applied to the rows they cite
      detectors: [round_amount]
      group: entity_evidence
      cap: 0.3
      scored: true
      label: Counterparty-level evidence
    benford:              # digit-distribution deviation of a subgroup: a sampling lead, never proof
      detectors: [benford_subgroup]
      group: benford
      cap: 0.15
      scored: true
      label: Benford subgroup sample
    statistical_anomaly:  # P8 Isolation Forest
      detectors: [isolation_forest]
      group: anomaly
      cap: 0.4
      scored: true
      label: Statistical anomaly
    peer_anomaly:         # P8 robust peer z
      detectors: [robust_peer]
      group: anomaly
      cap: 0.4
      scored: true
      label: Peer-group deviation
    tail_anomaly:         # P8 tail percentiles
      detectors: [tail_percentile]
      group: anomaly
      cap: 0.2
      scored: true
      label: Extreme value (tail)
    data_quality:         # P4 integrity issues: reported beside the risk, never fraud risk by themselves
      detectors: [balance_continuity]
      group: data_quality
      cap: 0.0
      scored: false
      label: Data-quality issue (not scored)
  # Group caps: the three P8 families measure "unusual" from overlapping features, so together they count as one
  # independent source capped at 0.45 — anomaly evidence alone can never reach the high tier.
  groups:
    anomaly: {cap: 0.45}
  within_family_decay: 0.5        # the 2nd signal of a family counts half, the 3rd a quarter, …
  # Tiers need a score AND corroboration by independent sources (groups), so one detector — however strong — or a
  # single large but otherwise ordinary payment never reaches high on its own.
  tiers:
    medium: 25
    high: 50
    critical: 75
    min_sources_high: 2
    min_sources_critical: 3
  # Review-volume guard: high + critical should not exceed 2% of scored rows (critical 0.5%). Exceeding it raises
  # a calibration warning; raw scores and tiers are never altered. The review queue is the `top_k` highest
  # priorities (tier, score, independent sources, amount, transaction ID).
  review:
    max_high_share: 0.02
    max_critical_share: 0.005
    top_k: 250
  # Entity (counterparty stream) risk: noisy-OR of its `top_k` riskiest transactions with the same diminishing
  # returns; each transaction counts once (entity-level signals are already inside its transactions' scores).
  entities:
    top_k: 3
    decay: 0.5
  max_contributors: 5             # contributors listed in an explanation (all remain in the detail)

# ---------------------------------------------------------------------------------------------
# P10 — supervised training and leakage-safe evaluation (docs/supervised-model-card.md). An OPTIONAL experiment
# layer: labels are read only by ledgerspy/supervised/labels.py, never by P6–P9, and nothing here changes the P9
# score. Model outputs are ranking scores; they are called probabilities only when calibration is validated.
supervised:
  seed: 42
  target:
    paysim_label_column: isFraud            # isFlaggedFraud is never used (it is the simulator's own rule flag)
    synthetic_min_severity: medium          # P5 injected scenarios of this severity or higher are positives …
    synthetic_exclude_scenario_types:       # … except those the ground truth itself says are not fraud
      - digit_distribution_anomaly          # S-T-01: "Not labelled as fraud" (a Benford test target)
  # Training data contract: P6 registry features only (row / point-in-time semantics), no identifiers, no P7/P8/P9
  # outputs, no labels. Every inclusion and exclusion is recorded in each experiment (docs: feature table).
  features:
    version: 1
    numeric:
      - log_amount
      - amount_robust_z
      - amount_pctl_prior
      - amount_to_cp_median_ratio
      - amount_to_account_median_ratio
      - cp_prev_amount_ratio
      - cp_prior_count
      - cp_days_since_prev
      - cp_days_since_first
      - cp_count_7d
      - cp_count_30d
      - cp_velocity_ratio
      - cp_count_30d_peer_ratio
      - cp_log_amount_trend
      - hour_of_day
      - hour_deviation
      - is_after_hours
      - is_non_working_weekday
      - is_holiday
      - days_to_month_end
      - days_to_fiscal_year_end
      - posting_lag_days
      - round_level
      - threshold_proximity
      - is_outflow
      - pair_prior_count
      - pair_share_of_payer_outflow
      - payer_new_payees_7d
      - payer_distinct_payees_prior
      - payee_distinct_payers_prior
      - is_reciprocal_pair
    log_transform: [amount_to_cp_median_ratio, amount_to_account_median_ratio, cp_prev_amount_ratio, cp_prior_count,
                    cp_days_since_prev, cp_days_since_first, cp_count_7d, cp_count_30d, cp_velocity_ratio,
                    cp_count_30d_peer_ratio, posting_lag_days, pair_prior_count, payer_new_payees_7d,
                    payer_distinct_payees_prior, payee_distinct_payers_prior]
    categorical: [txn_type]                 # one-hot, categories learnt on the training split only
    max_missing_share: 0.5                  # in the training split; above this the feature is dropped (recorded)
    ablations:
      no_simulator_fields: [txn_type, is_outflow]  # PaySim: fraud only in TRANSFER / CASH_OUT; direction is derived from type
  # Split first, then fit everything (imputation, scaling, encodings, models) on the training split only.
  splits:
    train: 0.6
    validation: 0.2
    test: 0.2
    strategies: [random_stratified, chronological, group]
  imbalance: [none, balanced]               # class weights only; no oversampling anywhere
  models:
    logistic_regression: {l2: 1.0, max_iter: 50, tol: 1.0e-8}
    gradient_boosting: {n_estimators: 100, learning_rate: 0.1, max_depth: 3, max_bins: 32, min_samples_leaf: 20, l2: 1.0}
  evaluation:
    review_share: 0.02                      # operating threshold: the score of the top 2% of VALIDATION rows
    top_k: [25, 50]                         # review capacity on the test split
    bootstrap: {resamples: 500, seed: 7, confidence: 0.95}
    calibration_bins: 10
  calibration:
    method: platt                           # isotonic needs ~1,000 positives (architecture §5.2); we have far fewer
    min_validation_positives: 30            # fewer: calibration is not attempted (score stays a ranking score)
    max_ece: 0.05                           # calibrated only if the test ECE is at most this
  permutation_repeats: 2
